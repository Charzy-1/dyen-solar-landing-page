<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar landing page</title>

  <link rel="stylesheet" href="/styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
  <header class="container">

    <div class="nav-container">

      <a href="#home" class="logo">
        <span class="logo-box">Z</span>
        <span class="logo-name">Zitotech</span>
      </a>

      <!-- My on/off switch with two states unchecked → menu closed and checked   → menu open -->
      <input type="checkbox" id="nav-toggle" class="a11y-toggle">
      
      <label for="nav-toggle" class="hamburger" aria-label="Open menu"> 
        <span></span>
        <span></span>
        <span></span>
      </label>

      <div class="nav-link-container">
        <nav class="nav-links">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#request">Request</a>
          <a href="services">Services</a>
        </nav>

        <a href="#contact" class="btn-action">
          Contact us
        </a>
      </div>
      
    </div>
  </header>

  <main>
    <section class="hero-section">

      <img src="/images/heroimage1.jpg" alt="An installer standing on the roof with panels" class="hero-image">
      <div class="hero_readthrough_backgroud"></div>
      <div class="hero-content">
        <h1>Strong Roofs.
        <br>
        strong Business</h1>
        <p>
          Reliable roofing solutions built to protect your property,
          withstand demanding conditions, and keep your business
          moving forward.
        </p>
        <a href="#" class="btn-action"> Get our Quote</a>

      </div>
    </section>

    <section class="hero-card wrap">
      <div class="card">
        <div class="inner-card"></div>

        
      </div>

      <div class="card">
        <div class="inner-card"></div>
      </div>

      <div class="card">
        <div class="inner-card"></div>
      </div>
    </section>
  </main>
  
</body>
</html>
